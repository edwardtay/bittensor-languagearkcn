[project]
name = "languageark"
version = "0.1.0"
description = "Endangered-Chinese-language preservation as a Bittensor subnet (Hokkien v1)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "sacrebleu>=2.4",
    "numpy>=1.26",
    "click>=8.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
miner = [
    "transformers>=4.40",
    "torch>=2.2",
    "torchaudio>=2.2",
    "sentencepiece>=0.2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "accelerate>=0.30",
]
chain = [
    "bittensor>=9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["languageark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
