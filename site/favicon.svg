<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 言 (yán = speech / language): dot + 3 horizontals + 口 -->
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="30" y1="7"  x2="35" y2="12"/>  <!-- 丶 dot -->
    <line x1="9"  y1="16" x2="55" y2="16"/>  <!-- 一 long horizontal -->
    <line x1="15" y1="23" x2="49" y2="23"/>  <!-- 一 medium horizontal -->
    <line x1="15" y1="30" x2="49" y2="30"/>  <!-- 一 medium horizontal -->
  </g>
  <!-- 口 mouth box -->
  <rect x="18" y="35" width="28" height="11" rx="1.5"
        fill="none" stroke="#fff" stroke-width="3.5"/>
  <!-- ark hull -->
  <path d="M8 51 Q32 60 56 51 L52 55 Q32 59 12 55 Z" fill="#fff"/>
</svg>
