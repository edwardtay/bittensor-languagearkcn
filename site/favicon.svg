<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <!-- 言 radical: top stroke + three horizontals + mouth box -->
  <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round">
    <line x1="22" y1="14" x2="32" y2="10"/>
    <line x1="18" y1="20" x2="46" y2="20"/>
    <line x1="22" y1="28" x2="42" y2="28"/>
  </g>
  <!-- mouth box (口) -->
  <rect x="22" y="33" width="20" height="9" rx="1.5" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- ark hull -->
  <path d="M8 50 Q32 62 56 50 L52 54 Q32 60 12 54 Z" fill="#fff"/>
  <!-- mast pin -->
  <circle cx="32" cy="48" r="1.8" fill="#fff"/>
